<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epicycle Ink · Draw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Draw one line</h1>
    <p>Draw something with your finger, mouse or Pencil, in one go without lifting.</p>
  </header>
  <main>
    <canvas id="pad" width="1200" height="1200"></canvas>
    <section class="panel">
      <div class="row"><button id="clear">Clear</button></div>
      <label class="slider">
        <span>Circles</span>
          <input type="range" id="count" min="1" max="80" value="80">
        <output id="countOut">80</output>
      </label>
      <p class="hint">Slide down to use only the biggest circles. Which part of your drawing disappears first?</p>
      <p id="info">0 points</p>
    </section>
  </main>
  <script src="fourier.js"></script>
  <script src="draw.js"></script>
</body>
</html>
