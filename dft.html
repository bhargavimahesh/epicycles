<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFT Flash Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito+Sans:ital,wght@0,300;0,400;0,700;1,300&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one card at a time; picture left, words right; arrows on the sides. Marigold and teal accents. */
:root {
  /* always dark, like the Epicycles app */
  --bg: #16181d; --card: #111316; --fg: #f2f3f5; --muted: #9aa1ad; --line: #2a2e35;
  --accent: #ffd23f; --accent-soft: #111316; --teal: #4cc9f0; --screen: #000000; color-scheme: dark;
  --display: "Playfair Display", Georgia, serif;
  --body: "Avenir", "Avenir Next", "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181d; --card: #111316; --fg: #f2f3f5; --muted: #9aa1ad; --line: #2a2e35;
  --accent: #ffd23f; --accent-soft: #111316; --teal: #4cc9f0; --screen: #000000; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181d; --card: #111316; --fg: #f2f3f5; --muted: #9aa1ad; --line: #2a2e35;
  --accent: #ffd23f; --accent-soft: #111316; --teal: #4cc9f0; --screen: #000000; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-weight: 300; font-size: 17px; line-height: 1.55; margin: 0; }
b, strong { font-weight: 700; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 16px; }
header h1 { font-family: var(--display); font-weight: 600; font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

.stage { position: relative; padding-inline: 34px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 24px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 8px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04);
  min-height: 0;
  align-items: center;
  /* the cards are always black, in light and dark mode */
  --card: #000000; --fg: #f2f3f5; --muted: #9aa1ad; --line: #2a2e35; --bg: #111316;
  --accent: #ffd23f; --accent-soft: #111316; --teal: #4cc9f0; --screen: #000000;
  background: var(--card); color: var(--fg); border-color: var(--line);
}
.card .code { background: #11151f; }
.card.enter { animation: enter 0.35s ease; }
@keyframes enter { from { opacity: 0; transform: translateX(var(--from, 24px)); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card.enter { animation: none; } }
canvas { display: block; width: 100%; height: auto; border-radius: 12px; background: var(--screen); }
.words { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chip { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.words h2 { font-family: var(--display); font-weight: 600; font-size: 1.6rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.words p { margin: 0; max-width: 62ch; }
.words ul { margin: -4px 0 0; padding-left: 1.3em; }
.formula {
  font-size: 1.05rem; padding: 4px 14px; border-radius: 10px;
  background: var(--accent-soft); border-left: 4px solid var(--accent); overflow-x: auto; overflow-y: hidden;
}
.code {
  font-family: var(--mono); font-size: 0.82rem; padding: 12px 14px; border-radius: 10px;
  background: var(--screen); color: #e5e7eb; overflow-x: auto; white-space: pre;
}
.small-label { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
.symbols { display: flex; flex-wrap: wrap; gap: 6px; }
.symbols span {
  font-size: 0.88rem; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg);
}
.symbols b { font-family: var(--mono); }
.next { margin: 0; color: var(--teal); font-weight: 700; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
th, td { padding: 4px 12px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { color: var(--muted); font-weight: 400; }
th:first-child, td:first-child { text-align: left; }

.side {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
  width: 52px; height: 52px; border-radius: 50%;
  border: 1px solid var(--line); background: #111316; color: var(--accent);
  font-size: 1.5rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
}
.side.left { left: 0; }
.side.right { right: 0; }
.side:disabled { opacity: 0.3; cursor: default; }
button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.dots button {
  font: inherit; font-size: 0.8rem; font-weight: 700; min-height: 32px; min-width: 32px; border-radius: 50%;
  border: 1px solid var(--line); background: #111316; color: var(--accent); cursor: pointer; padding: 0;
}
.dots button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #000; }
.pick { display: flex; align-items: center; gap: 12px; font-weight: 400; }
.pick input { flex: 1; accent-color: var(--accent); min-height: 32px; }
.pic { position: relative; }
.pic canvas { cursor: pointer; }
.play {
  position: absolute; left: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.6); color: #fff;
  font-size: 0.95rem; cursor: pointer;
}
.play:hover { background: rgba(255,255,255,0.15); }
/* the bonus keeps its space reserved, so opening it never moves the text above */
.bonus { font-size: 0.92rem; color: var(--muted); }
.bonus-toggle { font: inherit; font-weight: 400; color: rgba(255, 210, 63, 0.7); background: none; border: 0; padding: 0; cursor: pointer; }
.bonus-toggle:hover { color: var(--accent); }
.bonus-toggle::before { content: "▸"; display: inline-block; margin-right: 6px; transition: transform 0.25s ease; }
.bonus.open .bonus-toggle::before { transform: rotate(90deg); }
.bonus-toggle:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.bonus-body { visibility: hidden; opacity: 0; transform: translateY(-6px); transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s; }
.bonus.open .bonus-body { visibility: visible; opacity: 1; transform: none; }
.bonus-body p { margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { .bonus-body, .bonus-toggle::before { transition: none; } }
.hint-inline { font-size: 0.88rem; color: var(--muted); }
.hint { font-size: 0.88rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.goto { font: inherit; color: var(--teal); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.keys { color: var(--muted); font-size: 0.85rem; text-align: center; margin: 0; }

@media (max-width: 860px) {
  .card { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .stage { padding-inline: 0; }
  .side { top: 140px; width: 44px; height: 44px; opacity: 0.92; }
  .side.left { left: 6px; }
  .side.right { right: 6px; }
}
.back { margin: 0 0 6px; font-size: 0.9rem; }
.back a { color: var(--teal); }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <p class="back"><a href="index.html">← Back to Epicycles</a></p>
    <h1>From a circle to epicycles</h1>
    <p>How the Epicycles project turns a drawing into circles, in 16 steps.</p>
  </header>

  <div class="stage">
    <button class="side left" id="prev" aria-label="Previous card">‹</button>
    <article class="card" id="card" aria-live="polite"></article>
    <button class="side right" id="next" aria-label="Next card">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <p class="keys">Keyboard: ← and → to move between cards, space to pause or play.</p>
</div>

<script>
window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]] }, svg: { fontCache: "global" }, startup: { typeset: false } };
</script>
<script src="lib/tex-svg-full.js" id="MathJax-script"></script>
<script>
// ================= the maths behind the pictures (the same as fourier.js in the project) =================
function resample(points, n) {
  const loop = [...points, points[0]], lengths = [];
  let total = 0;
  for (let i = 1; i < loop.length; i++) {
    const len = Math.hypot(loop[i][0] - loop[i - 1][0], loop[i][1] - loop[i - 1][1]);
    lengths.push(len); total += len;
  }
  const step = total / n, out = [];
  let seg = 0, walked = 0;
  for (let i = 0; i < n; i++) {
    const target = i * step;
    while (seg < lengths.length - 1 && walked + lengths[seg] < target) { walked += lengths[seg]; seg++; }
    const f = lengths[seg] ? (target - walked) / lengths[seg] : 0;
    out.push([loop[seg][0] + f * (loop[seg + 1][0] - loop[seg][0]), loop[seg][1] + f * (loop[seg + 1][1] - loop[seg][1])]);
  }
  return out;
}
function dft(points, maxSpeed) {
  const N = points.length, circles = [];
  for (let k = -maxSpeed; k <= maxSpeed; k++) {
    let sumX = 0, sumY = 0;
    for (let n = 0; n < N; n++) {
      const [x, y] = points[n], a = 2 * Math.PI * k * n / N;
      sumX += x * Math.cos(a) + y * Math.sin(a);
      sumY += y * Math.cos(a) - x * Math.sin(a);
    }
    circles.push({ speed: k, radius: Math.hypot(sumX / N, sumY / N), start: Math.atan2(sumY / N, sumX / N) });
  }
  return circles;
}
function tipAt(circles, p) {          // where the pen is at lap position p (0..1)
  let x = 0, y = 0;
  for (const c of circles) { const a = c.start + 2 * Math.PI * c.speed * p; x += c.radius * Math.cos(a); y += c.radius * Math.sin(a); }
  return [x, y];
}
const shapeOf = (circles, steps = 400) => Array.from({ length: steps + 1 }, (_, i) => tipAt(circles, i / steps));

// the heart used on the later cards
const heartRaw = [];
for (let i = 0; i < 400; i++) {
  const s = 2 * Math.PI * i / 400;
  heartRaw.push([7.5 * 16 * Math.sin(s) ** 3, 7.5 * (13 * Math.cos(s) - 5 * Math.cos(2 * s) - 2 * Math.cos(3 * s) - Math.cos(4 * s)) + 14]);
}
const heart128 = resample(heartRaw, 128);
const heartCircles = dft(heart128, 20);
const heartSorted = heartCircles.slice().sort((a, b) => (a.speed === 0 ? -1 : b.speed === 0 ? 1 : b.radius - a.radius));
const heart16 = resample(heartRaw, 16);

// a drawing made of two arrows (speed 1 and speed 3), used to show the unwinding
const N2 = 24;
const twoArrows = [{ speed: 1, radius: 110, start: 0 }, { speed: 2, radius: 55, start: 0 }];   // same as card 5
const twoDots = Array.from({ length: N2 }, (_, n) => tipAt(twoArrows, n / N2));

// ================= drawing helpers (canvas 640 x 520; maths y points up) =================
const W = 640, H = 520;
// colours from the Epicycles app (shared.js PALETTE, style.css)
const PALETTE = ["#ff4d6d", "#ffd23f", "#3ddc97", "#4cc9f0", "#b388ff", "#ff8c42", "#f72585", "#c0ff3e", "#80ffdb", "#5e9bff"];
const C = { ring: "#3b4049", r: "#ff4d6d", x: "#ffd23f", y: "#3ddc97", z: "#4cc9f0", pen: "#ffffff", text: "#f2f3f5", faint: "#9aa1ad", star: "#ffd23f" };
function clear(g) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = "#000000"; g.fillRect(0, 0, W, H); g.lineCap = "round"; g.lineJoin = "round"; }
function seg(g, x0, y0, x1, y1, col, w = 3, dash) { g.setLineDash(dash || []); g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.setLineDash([]); }
function arrow(g, x0, y0, x1, y1, col, w = 4) {
  seg(g, x0, y0, x1, y1, col, w);
  if (Math.hypot(x1 - x0, y1 - y0) < 8) return;
  const a = Math.atan2(y1 - y0, x1 - x0), L = Math.min(13, 0.4 * Math.hypot(x1 - x0, y1 - y0));
  g.fillStyle = col; g.beginPath(); g.moveTo(x1, y1);
  g.lineTo(x1 - L * Math.cos(a - 0.45), y1 - L * Math.sin(a - 0.45));
  g.lineTo(x1 - L * Math.cos(a + 0.45), y1 - L * Math.sin(a + 0.45)); g.closePath(); g.fill();
}
function ring(g, x, y, r, col = C.ring, w = 2) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.stroke(); }
function dot(g, x, y, r, col) { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fill(); }
function labelRow(g, parts, x, y, size = 18) {   // left-aligned text in several colours
  g.font = `${size}px "Avenir", "Avenir Next", "Nunito Sans", system-ui, sans-serif`;
  for (const [t, col] of parts) { label(g, t, x, y, col, size, "left"); x += g.measureText(t).width; }
}
function labelParts(g, parts, x, y, size = 18) {   // centred text in several colours
  g.font = `${size}px "Avenir", "Avenir Next", "Nunito Sans", system-ui, sans-serif`;
  let px = x - parts.reduce((w, [t]) => w + g.measureText(t).width, 0) / 2;
  for (const [t, col] of parts) { label(g, t, px, y, col, size, "left"); px += g.measureText(t).width; }
}
function label(g, txt, x, y, col = C.text, size = 18, align = "left") { g.fillStyle = col; g.font = `${size}px "Avenir", "Avenir Next", "Nunito Sans", system-ui, sans-serif`; g.textAlign = align; g.fillText(txt, x, y); }
function angleArc(g, cx, cy, R, theta, col) {
  const a = ((theta % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, R, 0, -a, true); g.stroke();
  return a;
}
function star(g, x, y, r, col) {
  g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
  g.closePath(); g.fill();
}
const P = (cx, cy, x, y) => [cx + x, cy - y];
function ringA(g, x, y, r, col) { g.globalAlpha = 0.5; ring(g, x, y, r, col, 1.5); g.globalAlpha = 1; }
function penDot(g, x, y, r = 8) { g.shadowColor = C.x; g.shadowBlur = 16; dot(g, x, y, r, C.pen); g.shadowBlur = 0; }
function pathLine(g, pts, cx, cy, col, w, upto) {
  if (col === C.pen) { g.shadowColor = C.pen; g.shadowBlur = 10; }   // the drawing glows, as in the app
  g.strokeStyle = col; g.lineWidth = w; g.beginPath();
  const n = upto === undefined ? pts.length : upto;
  for (let i = 0; i < n; i++) { const [sx, sy] = P(cx, cy, pts[i][0], pts[i][1]); i ? g.lineTo(sx, sy) : g.moveTo(sx, sy); }
  g.stroke(); g.shadowBlur = 0;
}
function chain(g, circles, p, cx, cy, ringCol, heads) {
  let x = 0, y = 0;
  circles.forEach((c, i) => {
    const a = c.start + 2 * Math.PI * c.speed * p;
    const nx = x + c.radius * Math.cos(a), ny = y + c.radius * Math.sin(a);
    const [sx, sy] = P(cx, cy, x, y), [ex, ey] = P(cx, cy, nx, ny);
    const col = circles.length > 2 ? PALETTE[i % PALETTE.length] : (i % 2 ? C.z : C.r);
    if (c.speed !== 0 && c.radius > 1) ringA(g, sx, sy, c.radius, col);
    if (heads) arrow(g, sx, sy, ex, ey, col, 4);
    else { g.globalAlpha = 0.95; seg(g, sx, sy, ex, ey, col, 2.5); g.globalAlpha = 1; }
    x = nx; y = ny;
  });
  return P(cx, cy, x, y);
}
const turnBack = ([X, Y], a) => [X * Math.cos(a) + Y * Math.sin(a), Y * Math.cos(a) - X * Math.sin(a)];

// ================= one picture per card (sec = seconds since the card was opened) =================
const ARROW_COLS = ["#b388ff", "#ff8c42", "#f72585", "#c0ff3e"];
const flower = [{ speed: 1, radius: 105, start: 0 }, { speed: -4, radius: 58, start: 0 }, { speed: 6, radius: 36, start: 0 }, { speed: -9, radius: 22, start: 0 }];
const flowerPath = shapeOf(flower);
const lapHeart = [{ speed: 1, radius: 110, start: 0 }, { speed: 2, radius: 55, start: 0 }];   // both start along the floor
const lapHeartPath = shapeOf(lapHeart);
const PERIOD = 6;
let pickK = 1;
document.addEventListener("input", e => {
  if (e.target.id === "pickK") { pickK = +e.target.value; document.getElementById("kVal").textContent = pickK; }
});   // seconds per lap on the time card

const DRAW = {
  // 1. a dot on a circle, with both shadows
  circle(g, sec) {
    const cx = 300, cy = 280, U = 45, R = 4 * U, th = 0.55 * sec, wall = 560;   // same centre and scale as card 2
    label(g, "floor", 44, cy - 10, C.faint, 16);
    label(g, "wall", wall + 10, 66, C.faint, 16);
    seg(g, 40, cy, wall, cy, C.ring, 2);                 // the floor line
    seg(g, wall, 50, wall, H - 30, C.ring, 2);           // the wall
    ring(g, cx, cy, R);
    const [x, y] = P(cx, cy, R * Math.cos(th), R * Math.sin(th));
    seg(g, x, y, x, cy, C.x, 2, [6, 6]);
    seg(g, x, y, wall, y, C.y, 2, [6, 6]);
    seg(g, cx, cy, x, cy, C.x, 8);
    seg(g, wall, cy, wall, y, C.y, 8);
    seg(g, cx, cy, x, y, C.r, 4);
    const a = angleArc(g, cx, cy, 40, th, C.pen);
    label(g, "θ", cx + 62 * Math.cos(a / 2), cy - 62 * Math.sin(a / 2) + 7, C.pen, 24, "center");
    label(g, "r", (cx + x) / 2 - 18 * Math.sin(th), (cy + y) / 2 - 18 * Math.cos(th) + 7, C.r, 24, "center");
    dot(g, x, y, 10, C.pen);
    labelParts(g, [["x = ", C.x], ["r", C.r], ["·cos θ", C.x]], (cx + x) / 2, cy + 36, 20);
    g.save(); g.translate(wall + 26, (cy + y) / 2); g.rotate(-Math.PI / 2);
    labelParts(g, [["y = ", C.y], ["r", C.r], ["·sin θ", C.y]], 0, 6, 20); g.restore();
  },
  // 2. the complex plane
  plane(g, sec) {
    const cx = 300, cy = 280, U = 45, th = Math.PI / 4 + (Math.PI / 4) * Math.sin(0.35 * sec), R = 4;
    for (let i = -5; i <= 6; i++) { seg(g, cx + i * U, 40, cx + i * U, H - 40, "#15181d", 1); }
    for (let j = -4; j <= 4; j++) { seg(g, 20, cy - j * U, W - 20, cy - j * U, "#15181d", 1); }
    arrow(g, 30, cy, W - 20, cy, C.faint, 2); arrow(g, cx, H - 30, cx, 30, C.faint, 2);
    label(g, "real", W - 24, cy + 26, C.x, 18, "right"); label(g, "imaginary (i)", cx + 10, 44, C.y, 18);
    for (let i = 1; i <= 4; i++) {
      label(g, String(i), cx + i * U, cy + 20, C.faint, 14, "center");
      label(g, String(i), cx - 8, cy - i * U + 5, C.faint, 14, "right");
    }
    ring(g, cx, cy, R * U, "rgba(76,201,240,0.25)", 1.5);
    const X = R * Math.cos(th), Y = R * Math.sin(th);
    const [x, y] = P(cx, cy, X * U, Y * U);
    seg(g, cx, cy, x, cy, C.x, 6); seg(g, x, cy, x, y, C.y, 6);
    arrow(g, cx, cy, x, y, C.r, 5);
    dot(g, x, y, 9, C.z);
    {   // keep the z label inside the picture: smaller, and flipped to the left near the right edge
      const txt = `z = ${X.toFixed(2)} + ${Y.toFixed(2)}i`;
      g.font = `17px "Avenir", "Avenir Next", "Nunito Sans", system-ui, sans-serif`;
      const w = g.measureText(txt).width, right = x + 14 + w > W - 10;
      label(g, txt, right ? x - 14 : x + 14, y - 14, C.z, 17, right ? "right" : "left");
    }
    label(g, `x = ${X.toFixed(2)}`, (cx + x) / 2, cy + 40, C.x, 17, "center");
    if (Y > 0.4) label(g, `y = ${Y.toFixed(2)}`, x + 10, (cy + y) / 2 + 6, C.y, 17);   // hide when it would sit on the point
    label(g, "circle of radius r = 4", cx + R * U * 0.71 + 10, cy + R * U * 0.71 + 18, C.r, 16);
  },
  // 3. adding circles
  sum(g, sec) {
    const cx = 320, cy = 260, p = (sec / 12) % 1, cols = ARROW_COLS;
    pathLine(g, flowerPath, cx, cy, "rgba(255,255,255,0.10)", 2);
    pathLine(g, flowerPath, cx, cy, C.pen, 3, Math.floor(p * 400) + 1);
    let x = 0, y = 0;
    flower.forEach((c, i) => {
      const a = c.start + 2 * Math.PI * c.speed * p;

    formula: R`\[ {\color[RGB]{76,201,240}z} = {\color[RGB]{255,210,63}x} + i\,{\color[RGB]{61,220,151}y} = {\color[RGB]{255,77,109}r}{\color[RGB]{255,210,63}\cos\theta} + i\,{\color[RGB]{255,77,109}r}{\color[RGB]{61,220,151}\sin\theta} = {\color[RGB]{255,77,109}r}e^{i\theta} \]`,
    after: R`<p>Using Euler's formula, \(e^{i\theta} = \cos\theta + i\sin\theta\), we can set \({\color[RGB]{76,201,240}z} = {\color[RGB]{255,77,109}r}e^{i\theta}\): an arrow of length \({\color[RGB]{255,77,109}r}\) at angle \(\theta\).</p>
      <div class="bonus"><button class="bonus-toggle" aria-expanded="false">Bonus: turning an arrow</button><div class="bonus-body"><p>Multiplying \(z\) by \(e^{ia}\) turns the arrow by the angle \(a\): \(re^{i\theta} \cdot e^{ia} = re^{i(\theta + a)}\). Same length, new angle. It turns anticlockwise; \(e^{-ia}\) turns clockwise.</p></div></div>` },

  { draw: "sum", title: "Going beyond a single circle",
    body: R`<p>For more circles, <b>add</b> arrows tip to tail. Imagine a <b>pen</b> on the last tip, creating the mesmerizing drawing.</p>
      <p>A circle riding on a circle is an <b>epicycle</b>.</p>
      <p>\(z_k\) is the \(k\)-th circle's arrow.</p>`,
    formula: R`\[ z = {\color[RGB]{179,136,255}z_1} + {\color[RGB]{255,140,66}z_2} + {\color[RGB]{247,37,133}z_3} + {\color[RGB]{192,255,62}z_4} = \sum_k z_k \]`,
    after: R`<p>The arrows turn, so \(z\) is a function of time:</p>
      <div class="formula">\[ z(t) = \sum_k z_k(t) \]</div>` },

  { draw: "omega", title: "How fast the point revolves",
    body: R`<p>\(\omega\) is the <b>angle an arrow turns per second</b>, in radians per second.</p>
      <p>After \(t\) seconds it has turned \({\color[RGB]{255,210,63}\theta} = \omega t\).</p>
      <p>If one full turn (\(2\pi\) radians) takes \(T\) seconds, then the <b>angular speed</b> is \(\omega = 2\pi / T\).</p>`,
    formula: R`\[ {\color[RGB]{255,210,63}\theta} = \omega\, t = \frac{2\pi t}{T} \]` },

  { draw: "time", title: "Each circle's turns per lap",
    body: R`<p>Each circle makes a <b>whole number of turns per lap</b>. Call that number \({\color[RGB]{61,220,151}k}\), and use it as the circle's name: <b>circle \({\color[RGB]{61,220,151}k}\)</b>.</p>
      <p>\(\theta_{\color[RGB]{61,220,151}k}\) is how far circle \({\color[RGB]{61,220,151}k}\)'s arrow has turned so far: the \(\theta\) of <button class="goto" data-card="1">card 1</button>, now for circle \({\color[RGB]{61,220,151}k}\).</p>`,
    formula: R`\[ \theta_{\color[RGB]{61,220,151}k} = \omega_{\color[RGB]{61,220,151}k}\, t = \frac{2\pi {\color[RGB]{61,220,151}k}\, t}{T}, \quad \text{where } \omega_{\color[RGB]{61,220,151}k} = \frac{2\pi {\color[RGB]{61,220,151}k}}{T} \]`,
    after: R`<div class="bonus"><button class="bonus-toggle" aria-expanded="false">Bonus tip</button><div class="bonus-body"><p>When \({\color[RGB]{61,220,151}k} = 1\), the arrow makes exactly one full turn per lap: <b style="color: #ff4d6d">circle 1</b> <span style="white-space: nowrap">(\({\color[RGB]{61,220,151}k} = -1\)</span> turns once the other way).</p></div></div>` },

  { draw: "puzzle", title: "Basics done!<br>How do we find the circles behind any closed drawing?",
    body: R`<p style="color: var(--accent)">Welcome to the world of the <b>Discrete Fourier Transform (DFT)</b>!</p>` },

  { draw: "startTurn", title: "Where each arrow starts",
    body: R`<p>Let \(c_k\) be arrow \(k\) at the start of the lap: one per circle. <span class="hint-inline">(hint: \(c_k\) is not just the radius \(r_k\))</span></p>
      <p>As time runs, arrow \(k\) is \(c_k\) turned by \(\theta_k\). Over one lap, the pen traces the drawing:</p>`,
    formula: R`\[ \begin{gathered} z(t) = \sum_k {\color[RGB]{255,210,63}\overbrace{\rule{0pt}{16pt} {\color[RGB]{242,243,245}c_k}}^{\mathclap{\text{where it starts}}}} \, {\color[RGB]{255,210,63}\underbrace{\rule[-8pt]{0pt}{0pt} {\color[RGB]{242,243,245}e^{i 2\pi k t / T}}}_{\mathclap{\text{how much it turns}}}} \\[10pt] \text{where} \quad c_k = z_k(0) \end{gathered} \]` },

  { draw: "dots", title: "Evenly spaced points",
    body: R`<p>Now we move from <b>continuous</b> \(z(t)\) to <b>discrete</b> \({\color[RGB]{76,201,240}z_n}\).</p>
      <p>Split the lap into \(N\) equal <b>time steps</b>, \(n = 0, 1, \dots, N-1\), and take one point at each.</p>
      <p>\({\color[RGB]{255,210,63}t_n}\) is the moment the pen reaches point \(n\); \({\color[RGB]{76,201,240}z_n}\) is where the pen is then.</p>`,
    formula: R`\[ \begin{gathered} {\color[RGB]{255,210,63}t_n} = \frac{n\,T}{N}, \qquad {\color[RGB]{76,201,240}z_n} = z({\color[RGB]{255,210,63}t_n}) \\[10pt] \text{where } T \text{ is the total lap time} \end{gathered} \]`,
    after: R`<p>At the time steps \(t = {\color[RGB]{255,210,63}t_n}\), the angle \(2\pi k t / T\) on <button class="goto" data-card="7">card 7</button> becomes \(2\pi k {\color[RGB]{255,210,63}t_n} / T = 2\pi k n / N\):</p>
      <div class="formula">\[ {\color[RGB]{76,201,240}z_n} = \sum_k c_k\, e^{i 2\pi k n / N} \]</div>` },

  { draw: "ride", title: "Turn every point back",
    body: R`<p style="color: var(--accent)"><b>Goal:</b> find \(c_k\), the starting arrow of one circle \(k\), using only the points of the drawing.</p>
      <p>At time step \(n\), arrow \(k\) has turned by \(2\pi k n / N\). <b>Undo that turn</b>: multiply every point \({\color[RGB]{76,201,240}z_n}\) of the drawing by \(e^{-i 2\pi k n / N}\).</p>
      <p>Each point is the sum of all arrows (<button class="goto" data-card="8">card 8</button>). We now number <b>all</b> arrows with \(j\), because \(k\) is the <b>one</b> arrow we look for: \({\color[RGB]{76,201,240}z_n} = \sum_j c_j\, e^{i 2\pi j n / N}\). Turning it back gives</p>`,
    formula: R`\[ {\color[RGB]{76,201,240}z_n}\, e^{-i 2\pi k n / N} = c_k + \sum_{j \neq k} c_j\, e^{i 2\pi (j-k) n / N} \]`,
    after: R`<p>Arrow \(k\) <b>freezes</b> at \(c_k\). Every other arrow \(j\) still <b>turns</b>, \(j - k\) times per lap.</p>` },

  { draw: "avgPts", title: "Average the turned-back points",
    body: R`<p>Now <b>average</b> both sides of the equation on <button class="goto" data-card="9">card 9</button>: add all \(N\) turned-back points and divide by \(N\).</p>`,
    formula: R`\[ \begin{aligned} &\frac{1}{N}\sum_{n=0}^{N-1} {\color[RGB]{76,201,240}z_n}\, e^{-i 2\pi k n / N} \\ &\quad = c_k + \sum_{j \neq k} c_j\, \underbrace{\frac{1}{N}\sum_{n=0}^{N-1} e^{i 2\pi (j-k) n / N}}_{\color[RGB]{255,210,63}\text{turning arrow: average } 0} \\ &\quad = c_k \end{aligned} \]`,
    after: R`<p>The frozen \(c_k\) survives; every turning arrow averages to 0 (why: <button class="goto" data-card="11">card 11</button>).</p>` },

  { draw: "zero", title: "Average over the points",
    body: R`<p>Now <b>average</b> the turned-back points: add all \(N\) of them and divide by \(N\).</p>
      <p>A turning arrow points every way equally, so its average is <b>0</b>. The frozen arrow is the same at every point, so its average is <b>itself</b>.</p>`,
    formula: R`\[ \frac{1}{N}\sum_{n=0}^{N-1} e^{i 2\pi (j-k) n / N} = \begin{cases} 1 & j = k \text{ (frozen)} \\ 0 & j \neq k \text{ (turning)} \end{cases} \]`,
    after: R`<p>Everything except \(c_k\) cancels out.</p>` },

  { draw: "unwind", title: "The DFT",
    body: R`<p>Put <button class="goto" data-card="9">card 9</button> and <button class="goto" data-card="10">card 10</button> together:</p>`,
    formula: R`\[ c_k = {\color[RGB]{255,210,63}\underbrace{{\color[RGB]{242,243,245}\frac{1}{N}\sum_{n=0}^{N-1}}}_{\text{average (card 10)}}} \; {\color[RGB]{255,210,63}\underbrace{{\color[RGB]{76,201,240}z_n}\, {\color[RGB]{242,243,245}e^{-i 2\pi k n / N}}}_{\text{turn back (card 9)}}} \]`,
    after: R`<p>Turn every point back by arrow \(k\)'s angle, then average. Whatever survives is \(c_k\). Do this for every \(k\): that is the <b>DFT</b>.</p>` },

  { draw: "pick", title: "Try every k",
    body: R`<p>Pick \(k\), turn the points back and average them (★). Only arrows that are really in the drawing survive.</p>`,
    after: R`<label class="pick">\(k\): <b id="kVal">1</b>
        <input type="range" id="pickK" min="-3" max="5" step="1" value="1"></label>
      <p>Only \(k = 1\) and \(k = 2\) leave an arrow: exactly the two circles from <button class="goto" data-card="5">card 5</button>.</p>` },

  { draw: "four", title: "By hand: 4 points",
    body: R`<p>Points: \(z_0 = 2,\; z_1 = 2i,\; z_2 = -2,\; z_3 = -2i\). Here \(N = 4\), so point \(n\) is turned back by \(n \cdot 90°\) for \(k = 1\).</p>`,
    table: R`<table>
      <thead><tr><th>\(k\)</th><th>turned-back points</th><th>\(c_k\)</th></tr></thead>
      <tbody>
        <tr><td>\(1\)</td><td>\(2,\ 2,\ 2,\ 2\)</td><td>\(\mathbf{2}\)</td></tr>
        <tr><td>\(2\)</td><td>\(2,\ -2i,\ -2,\ 2i\)</td><td>\(0\)</td></tr>
        <tr><td>\(0\)</td><td>\(2,\ 2i,\ -2,\ -2i\)</td><td>\(0\)</td></tr>
        <tr><td>\(-1\)</td><td>\(2,\ -2,\ 2,\ -2\)</td><td>\(0\)</td></tr>
      </tbody></table>`,
    after: R`<p>Only \(c_1 = 2\) survives: one circle of radius 2, once per lap, pointing right when the lap begins.</p>` },

  { draw: "polar", title: "From \\(c_k\\) to a circle",
    body: R`<p>\(c_k\) is an arrow, just like \(z = re^{i\theta}\) on <button class="goto" data-card="2">card 2</button>.</p>
      <ul><li>its <b>length</b> is the radius \({\color[RGB]{255,77,109}r_k}\)</li>
        <li>its <b>direction</b> is the <b>start angle</b> \(\varphi_k\): where circle \(k\) points when the lap begins</li></ul>`,
    formula: R`\[ c_k = {\color[RGB]{255,77,109}r_k}\, e^{i\varphi_k}, \quad \text{where } {\color[RGB]{255,77,109}r_k} = |c_k|, \ \varphi_k = \arg c_k \]`,
    after: R`<p>So each circle is three numbers: radius \({\color[RGB]{255,77,109}r_k}\), turns per lap \(k\), start angle \(\varphi_k\).</p>` },

  { draw: "epicycles", title: "The epicycles",
    body: R`<p>The DFT of the heart gives one circle per \(k\). The biggest ones:</p>`,
    table: R`<table><thead><tr><th>\(k\)</th><th>\(r_k\)</th><th>\(\varphi_k\)</th></tr></thead><tbody>${topRows}</tbody></table>`,
    formula: R`\[ z(t) = \sum_k r_k\, e^{i(2\pi k t / T + \varphi_k)} \]`,
    after: R`<p>Chain them biggest first and run \(t\) from 0 to \(T\): the heart comes back. A few big circles carry the shape; small ones add detail.</p>` },

];

// ================= the card viewer =================
let index = 0, direction = 1, elapsed = 0, last = null, paused = false;
function setPaused(v) {
  paused = v;
  const b = document.getElementById("play");
  if (b) { b.textContent = paused ? "▶" : "❚❚"; b.setAttribute("aria-label", paused ? "Play animation" : "Pause animation"); }
}
document.addEventListener("click", e => {
  if (e.target.id === "play" || e.target === canvas) setPaused(!paused);
  const bt = e.target.closest && e.target.closest(".bonus-toggle");
  if (bt) { const box = bt.parentElement, open = !box.classList.contains("open"); box.classList.toggle("open", open); bt.setAttribute("aria-expanded", open); }
  if (e.target.classList && e.target.classList.contains("goto")) go(+e.target.dataset.card - 1);
});
const canvas = document.createElement("canvas");
canvas.width = W; canvas.height = H;
canvas.setAttribute("role", "img");
const g = canvas.getContext("2d");
const cardEl = document.getElementById("card");

function cardHTML(c) {
  return `
    <div class="pic"><button class="play" id="play" aria-label="Pause animation">❚❚</button></div>
    <div class="words">
      <h2>${c.title}</h2>
      ${c.body}
      ${c.formula ? `<div class="formula">${c.formula}</div>` : ""}
      ${c.table ? `<div class="table-wrap">${c.table}</div>` : ""}
      ${c.after || ""}
    </div>`;
}
function render() {
  const c = CARDS[index];
  const builds = index === 0 ? "the first step" : `builds on card ${index}`;
  const symbols = (c.symbols || []).map(([s, d]) => `<span><b>${s}</b> ${d}</span>`).join("");
  cardEl.innerHTML = cardHTML(c);
  canvas.setAttribute("aria-label", c.title.replace(/<[^>]+>/g, " "));
  typeset();
  cardEl.querySelector(".pic").appendChild(canvas);
  cardEl.style.setProperty("--from", direction > 0 ? "24px" : "-24px");
  cardEl.classList.remove("enter"); void cardEl.offsetWidth; cardEl.classList.add("enter");
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === CARDS.length - 1;
  document.querySelectorAll("#dots button").forEach((b, i) => b.setAttribute("aria-current", i === index));
}
let mjChain = Promise.resolve();   // MathJax jobs must run one after another
function mathjax(job) {
  const mj = window.MathJax;
  if (!(mj && mj.typesetPromise)) return new Promise(r => setTimeout(r, 150)).then(() => mathjax(job));
  return (mjChain = mjChain.then(() => job(mj)).catch(() => {}));
}
function typeset() { mathjax(mj => mj.typesetPromise([cardEl])); }

// every card gets the height of the tallest one, so the card never changes size
async function equalHeights() {
  const probe = cardEl.cloneNode(false);
  probe.removeAttribute("id"); probe.removeAttribute("aria-live"); probe.classList.remove("enter");
  probe.setAttribute("aria-hidden", "true");
  probe.style.cssText = `position:absolute;visibility:hidden;pointer-events:none;left:0;top:0;min-height:0;width:${cardEl.getBoundingClientRect().width}px`;
  cardEl.parentNode.appendChild(probe);
  let max = 0;
  for (const c of CARDS) {
    await mathjax(mj => { mj.typesetClear([probe]); });
    probe.innerHTML = cardHTML(c).replace(/ id="[^"]*"/g, "");
    const blank = document.createElement("canvas"); blank.width = W; blank.height = H;
    probe.querySelector(".pic").appendChild(blank);
    await mathjax(mj => mj.typesetPromise([probe]));
    max = Math.max(max, probe.offsetHeight);
  }
  await mathjax(mj => { mj.typesetClear([probe]); });
  probe.remove();
  cardEl.style.minHeight = max + "px";
}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(equalHeights, 300); });
function go(i) {
  if (i < 0 || i >= CARDS.length || i === index) return;
  direction = i > index ? 1 : -1;
  index = i; elapsed = 0; render(); setPaused(paused);
}
const dotsEl = document.getElementById("dots");
CARDS.forEach((c, i) => {
  const b = document.createElement("button");
  b.textContent = i + 1; b.setAttribute("aria-label", `Card ${i + 1}: ${c.title.replace(/<[^>]+>/g, " ")}`);
  b.addEventListener("click", () => go(i));
  dotsEl.appendChild(b);
});
document.getElementById("prev").addEventListener("click", () => go(index - 1));
document.getElementById("next").addEventListener("click", () => go(index + 1));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;   // let the slider use the arrow keys
  if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
  if (e.key === "ArrowRight") go(index + 1);
  if (e.key === "ArrowLeft") go(index - 1);
});

const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(now) {
  clear(g);
  if (last !== null && !paused) elapsed += Math.min(0.1, (now - last) / 1000);
  last = now;
  DRAW[CARDS[index].draw](g, still ? 4 : elapsed);
  requestAnimationFrame(loop);
}
render();
equalHeights();
requestAnimationFrame(loop);
</script>

</body>
