<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epicycle Ink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Spinning circles</h1>
    <p>Each circle spins around the tip of the circle before it. The last tip holds a pen.
       Change the circle parameters and see what the pen draws.</p>
    <p><a href="draw.html">Draw your own →</a></p>
  </header>

  <main>
    <canvas id="sheet" width="1200" height="1200"></canvas>

    <section class="panel">
      <div class="row">
        <button id="play">Pause</button>
        <button id="record">Record reel</button>
        <label class="slider">
          <span>Time per lap</span>
          <input type="range" id="lapTime" min="2" max="20" step="1" value="8">
          <output id="lapOut">8 s</output>
        </label>
      </div>

      <div id="arrowList"></div>
      <button id="add" class="primary">+ Add a circle</button>

      <div class="row presets">
        <span>Try:</span>
        <button data-preset="circle">Circle</button>
        <button data-preset="ellipse">Oval</button>
        <button data-preset="heart">Heart</button>
        <button data-preset="triangle">Triangle</button>
        <button data-preset="square">Square</button>
        <button data-preset="flower">Flower</button>
      </div>

      <p class="challenge"><strong>Challenge:</strong> Triangle uses speeds 1 and −2. Square uses 1 and −3.
        Can you make a star with 5 corners?</p>
    </section>
  </main>

  <script src="epicycles.js"></script>
</body>
</html>
